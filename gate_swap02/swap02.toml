# SWAP02 gate optimization example
# Single-oscillator system with 4 levels (3 essential)
# Optimizes a custom gate read from file

# System settings
nlevels = [4]
nessential = [3]
ntime = 20000
dt = 0.005
transfreq = [4.10595]
selfkerr = [0.2198]
crosskerr = { }
Jkl = { }
rotfreq = [4.10595]

# Decoherence settings (none = Schroedinger equation)
decoherence = { type = "none" }

# Initial conditions
initial_condition = { type = "basis" }

# Control parameterization
control_parameterization = { type = "spline", num = 30 }

# Carrier wave frequencies (GHz)
carrier_frequency = [0.0, -0.2198]

# Control initialization
control_initialization = { type = "constant", amplitude = 0.0015 }

# Control bounds (GHz)
control_bounds = 0.008

# Enforce boundary conditions
control_enforceBC = true

# Optimization target - gate from file
optim_target = { type = "gate", filename = "./gate_swap02.dat", gate_rot_freq = [0.0] }

# Objective function
optim_objective = "Jtrace"

# Weights for initial conditions
optim_weights = 1.0

# Optimization tolerances
optim_tolerance = { grad_abs = 1e-7, grad_rel = 1e-8, final_cost = 1e-6, infidelity = 1e-4 }

# Maximum iterations
optim_maxiter = 100

# Tikhonov regularization
optim_tikhonov = { coeff = 0.001, use_x0 = false }

# Penalty terms
optim_penalty = { leakage = 0.1, weightedcost = 0.1, weightedcost_width = 0.0, dpdm = 0.0, energy = 0.0 }

# Output settings
datadir = "./data_out"
output_type = ["population", "expectedEnergy"]
output_timestep_stride = 1
output_optimization_stride = 1

# Runtype
runtype = "optimization"

# Solver settings
usematfree = true
linearsolver = { type = "gmres", maxiter = 20 }
timestepper = "IMR"
rand_seed = 1234
