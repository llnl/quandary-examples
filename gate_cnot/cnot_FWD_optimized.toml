# CNOT gate simulation with pre-optimized pulses
# Forward simulation only using optimized control parameters

# System settings
nlevels = [2, 2]
nessential = [2, 2]
ntime = 1000
dt = 0.1
transfreq = [4.10595, 4.81526]
selfkerr = [0.2198, 0.2252]
crosskerr = { "0-1" = 0.1 }
Jkl = { }
rotfreq = [4.10595, 4.81526]

# Decoherence settings (none = Schroedinger equation)
decoherence = { type = "none" }

# Initial conditions
initial_condition = { type = "basis" }

# Control parameterization
control_parameterization = { type = "spline", num = 150 }

# Carrier wave frequencies (GHz)
carrier_frequency = [
  { subsystem = 0, values = [0.0, -0.2198, -0.1] },
  { subsystem = 1, values = [0.0, -0.2252, -0.1] }
]

# Control initialization from optimized parameters file
control_initialization = { type = "file", filename = "params_optimized.dat" }

# Control bounds (GHz)
control_bounds = 0.008

# Enforce boundary conditions
control_enforceBC = false

# Optimization target
optim_target = { type = "gate", gate_type = "cnot", gate_rot_freq = [0.0, 0.0] }

# Objective function
optim_objective = "Jtrace"

# Weights for initial conditions
optim_weights = 1.0

# Optimization tolerances
optim_tolerance = { grad_abs = 1e-7, grad_rel = 1e-8, final_cost = 1e-5, infidelity = 1e-5 }

# Maximum iterations
optim_maxiter = 200

# Tikhonov regularization
optim_tikhonov = { coeff = 0.00001, use_x0 = false }

# Penalty terms
optim_penalty = { leakage = 0.0, weightedcost = 0.0, weightedcost_width = 0.5, dpdm = 0.0, energy = 0.0 }

# Output settings
datadir = "./data_simulate_optim_pulses"
output_type = ["population", "expectedEnergy"]
output_timestep_stride = 1
output_optimization_stride = 1

# Runtype (simulation only)
runtype = "simulation"

# Solver settings
usematfree = true
linearsolver = { type = "gmres", maxiter = 20 }
timestepper = "IMR"
rand_seed = 1234
